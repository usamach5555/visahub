[build]
  command = "npm run build"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# One host only: canonicals, sitemap and structured data use the apex domain
# (lib/site.ts). Netlify already redirects www when the apex is primary; this
# keeps it explicit.
[[redirects]]
  from = "https://www.visaprocessinfo.com/*"
  to = "https://visaprocessinfo.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
